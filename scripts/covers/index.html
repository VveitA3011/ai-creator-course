<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  #stage {
    width: 1600px; height: 900px; position: relative; overflow: hidden;
    background:
      radial-gradient(620px 520px at 72% 46%, rgba(226,87,79,0.42), transparent 70%),
      radial-gradient(500px 420px at 92% 95%, rgba(146,119,238,0.32), transparent 70%),
      radial-gradient(700px 600px at 10% 10%, rgba(58,19,25,0.9), transparent 70%),
      linear-gradient(120deg, #2a0d11 0%, #4b1b22 55%, #5a2129 100%);
  }
  canvas { position: absolute; inset: 0; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage"></div>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { scenes } from "./scenes.js";

const id = new URLSearchParams(location.search).get("id");
const W = 1600, H = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById("stage").appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
camera.position.set(0, 2.4, 14);
camera.lookAt(0, 1.75, 0);

scene.add(new THREE.HemisphereLight("#ffe6d6", "#2a0d11", 0.7));
const key = new THREE.DirectionalLight("#fff1dc", 2.6);
key.position.set(-3, 7, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8; key.shadow.camera.right = 8; key.shadow.camera.top = 8; key.shadow.camera.bottom = -8;
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.03;
scene.add(key);
const rim1 = new THREE.DirectionalLight("#e2574f", 2.2); rim1.position.set(8, 3, -6); scene.add(rim1);
const rim2 = new THREE.DirectionalLight("#9277ee", 1.8); rim2.position.set(-2, 4, -8); scene.add(rim2);
const fill = new THREE.DirectionalLight("#f7e8a4", 0.5); fill.position.set(6, 1, 6); scene.add(fill);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.32 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const g = new THREE.Group();
try {
  scenes[id](g);
} catch (e) {
  document.title = "ERR " + e.message;
  throw e;
}
// Đặt chủ thể vào nửa phải khung hình và chuẩn hóa kích thước
const box = new THREE.Box3().setFromObject(g);
const size = box.getSize(new THREE.Vector3());
const fit = Math.min(5.6 / Math.max(size.x, 0.01), 4.6 / Math.max(size.y, 0.01), 1.25);
g.scale.multiplyScalar(fit);
const box2 = new THREE.Box3().setFromObject(g);
const ctr = box2.getCenter(new THREE.Vector3());
g.position.x += 3.15 - ctr.x;
g.position.y += -box2.min.y;
g.position.z += -ctr.z;
scene.add(g);

renderer.render(scene, camera);
document.title = "DONE";
</script>
</body>
</html>
